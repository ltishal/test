<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1614">
<title>🎲 RPG ИИ-Мастер</title>
<style>
  :root {
    --bg-deep: #0f0d0c; --bg-panel: #1a1614; --bg-card: #24201d;
    --border-subtle: #3a342f; --text-primary: #e8e0d5; --text-secondary: #a89f94;
    --accent-gold: #c9a227; --accent-crimson: #a63a3a; --accent-sapphire: #3a6ea6;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background: var(--bg-deep); }
  body {
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; height: 100dvh; font-size: 16px;
    background-image: radial-gradient(ellipse at 50% 0%, #2a2420 0%, var(--bg-deep) 70%);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: rgba(15, 13, 12, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; font-family: var(--font-serif); letter-spacing: 0.5px; }
  header h1 span { color: var(--accent-gold); }
  #status {
    background: rgba(26, 22, 20, 0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 10px 16px; display: flex; flex-direction: column; gap: 8px;
    font-size: 13px; flex-shrink: 0;
  }
  .status-row { display: flex; align-items: center; gap: 10px; }
  .status-top { display: flex; align-items: center; gap: 12px; }
  /* Pure emoji insignia: no image fetches or image-generation services. */
  .identity-crest {
    width: 50px; height: 50px; border-radius: 15px;
    border: 2px solid var(--accent-gold); background: #342a20;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 27px; cursor: pointer;
  }
  .identity-crest:focus-visible, .creator-option:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 3px; }
  .identity-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:2px; }
  .identity-tag {
    display:inline-flex; gap:5px; align-items:center; padding:3px 8px;
    background:#302820; border:1px solid #554333; border-radius:20px;
    font-size:11px; color:var(--text-primary); max-width:100%;
  }
  .identity-tag .symbol { font-size:15px; line-height:1.1; }
  .identity-hero { display:flex; align-items:center; gap:12px; padding:10px;
    border:1px solid var(--border-subtle); border-radius:12px; background:var(--bg-card); }
  .identity-hero-crest { font-size:47px; line-height:1.15; }
  .creator-group { display:flex; flex-direction:column; gap:8px; }
  .creator-heading { font-size:13px; color:var(--accent-gold); font-weight:700; }
  .creator-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .creator-option { display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 3px; min-height:61px; border:1px solid var(--border-subtle);
    border-radius:9px; background:var(--bg-card); color:var(--text-primary);
    cursor:pointer; font:inherit; font-size:11px; overflow-wrap:anywhere; }
  .creator-option .symbol { font-size:25px; line-height:1.3; }
  .creator-option.selected { border-color:var(--accent-gold); background:#3d301c; }
  .creator-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .creator-hint { font-size:12px; color:var(--text-secondary); }
  .status-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .status-name { font-weight: 700; color: var(--accent-gold); font-family: var(--font-serif); font-size: 15px; }
  .status-sub { font-size: 11px; color: var(--text-secondary); margin-top: -2px; }
  .status-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-chip {
    background: var(--bg-card); padding: 2px 8px; border-radius: 6px;
    color: var(--text-secondary); font-size: 11px;
    border: 1px solid var(--border-subtle);
  }
  .status-chip.dc-up { color: #d45a5a; border-color: #5a3a2a; background: #2a1f1a; }
  .status-chip.dc-down { color: #7fbf7f; border-color: #2a4a2a; background: #1f2a1f; }
  .status-chip.pos { color: #b48cff; border-color: #4a3a6e; background: #1f1a2a; }
  .status-chip.cover { color: #5a8ed4; border-color: #2a3a5a; background: #1a1f2a; }
  .status-chip.notes { color: #e8c8a8; border-color: #5a3a2a; background: #2a1f1a; cursor: pointer; }
  .bar-wrap { flex: 1; height: 6px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .bar-fill { height: 100%; transition: width 0.4s ease; border-radius: 4px; }
  .bar-hp { background: linear-gradient(90deg, #6b2020, #a63a3a, #d45a5a); }
  .bar-xp { background: linear-gradient(90deg, #2a4a6b, #3a6ea6, #5a8ed4); }
  .bar-label { min-width: 55px; text-align: right; color: var(--text-secondary); font-size: 11px; font-family: monospace; }
  #quick-actions {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 14px; background: rgba(15, 13, 12, 0.95);
    border-bottom: 1px solid var(--border-subtle);
    scrollbar-width: none; flex-shrink: 0;
  }
  #quick-actions::-webkit-scrollbar { display: none; }
  .quick-btn {
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: 18px;
    padding: 6px 14px; font-size: 13px; white-space: nowrap;
    cursor: pointer; flex-shrink: 0; font-family: var(--font-sans);
    transition: background 0.2s, transform 0.1s;
  }
  .quick-btn:active { background: #3a342f; transform: scale(0.95); }
  .quick-btn:disabled { opacity: 0.4; cursor: default; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    padding-bottom: 24px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .msg {
    max-width: 88%; padding: 12px 16px; border-radius: 12px;
    line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: var(--bg-card); border: 1px solid var(--border-subtle); border-bottom-right-radius: 4px; }
  .msg.master {
    align-self: flex-start; background: transparent;
    padding: 4px 0 4px 14px; font-family: var(--font-serif);
    font-size: 16px; color: #d8cec2; max-width: 100%;
    border-left: 3px solid var(--accent-gold); position: relative;
  }
  .msg.system {
    align-self: center; font-size: 13px; color: var(--text-secondary);
    background: var(--bg-panel); border: 1px dashed var(--border-subtle);
    padding: 8px 14px; max-width: 95%; text-align: center; border-radius: 8px;
  }
  .msg.dice {
    align-self: center; background: #2a1f1a; border: 1px solid #5a3a2a;
    color: #e8c8a8; font-family: 'SF Mono', Menlo, monospace;
    font-size: 14px; border-radius: 10px;
  }
  .msg.dice b { color: var(--accent-gold); }
  .msg.dice .dice-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 5px; }
  .msg.dice .dice-total { font-size: 21px; font-weight: 700; color: var(--accent-gold); }
  .msg.dice .dice-details { font-size: 12px; margin-top: 4px; color: #d5bea8; overflow-wrap: anywhere; }
  .msg.character-sheet {
    align-self: flex-start; max-width: min(100%, 560px); width: 100%; white-space: normal;
    background: linear-gradient(135deg, #30271c, #201c19); border: 1px solid #71582c;
    padding: 14px; color: var(--text-primary);
  }
  .character-sheet .sheet-heading { font: bold 17px var(--font-serif); color: var(--accent-gold); margin-bottom: 7px; }
  .character-sheet .sheet-meta { display: flex; flex-wrap: wrap; gap: 7px; font-size: 12px; color: var(--text-secondary); margin: 8px 0; }
  .character-sheet .sheet-meta span { padding: 4px 7px; border: 1px solid #554333; border-radius: 7px; }
  .character-sheet .sheet-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
  .character-sheet .sheet-stat { min-width: 0; border-radius: 8px; background: #1b1917; border: 1px solid #4c3b2a; padding: 8px 4px; text-align: center; }
  .character-sheet .sheet-stat-name { font-size: 11px; color: var(--text-secondary); }
  .character-sheet .sheet-stat-value { font-size: 19px; font-weight: 700; }
  .character-sheet .sheet-stat-mod { color: var(--accent-gold); font-size: 12px; }
  .character-sheet .sheet-footer { font-size: 12px; color: var(--text-secondary); margin-top: 10px; }
  .msg.dice .dice-emoji {
    display: inline-block; font-size: 20px; vertical-align: middle;
    animation: diceShake 0.35s ease-in-out infinite;
  }
  @keyframes diceShake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-25deg) scale(1.15); }
    50% { transform: rotate(25deg) scale(0.85); }
    75% { transform: rotate(-10deg) scale(1.05); }
  }
  .typing-indicator::after { content: '▍'; animation: blink 1s infinite; color: var(--accent-gold); }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .speak-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    background: transparent; border: 1px solid var(--border-subtle);
    color: var(--text-secondary); cursor: pointer; font-size: 13px;
    margin-left: 8px; vertical-align: middle;
    transition: background 0.15s, color 0.15s; padding: 0;
  }
  .speak-btn:hover { background: var(--bg-card); color: var(--accent-gold); }
  .speak-btn.playing { color: var(--accent-gold); border-color: var(--accent-gold); animation: ttsPulse 1.2s infinite; }
  @keyframes ttsPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .tts-active { color: var(--accent-gold); border-color: var(--accent-gold); }
  #input-bar {
    display: flex; gap: 8px; padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(15, 13, 12, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-subtle);
    align-items: flex-end; flex-shrink: 0;
  }
  #input {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border-subtle);
    color: var(--text-primary); border-radius: 10px;
    padding: 12px 14px; font-family: var(--font-sans);
    font-size: 16px; resize: none; outline: none; max-height: 120px;
    line-height: 1.4; transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--accent-gold); }
  #send-btn {
    width: 46px; height: 46px; border-radius: 10px;
    background: var(--accent-gold); color: #1a1614; border: none;
    font-size: 20px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.2s;
  }
  #send-btn:disabled { background: #4a4440; opacity: 0.5; }
  .btn { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; font-family: var(--font-sans); transition: background 0.2s; }
  .btn:active { background: #3a342f; }
  .btn.primary { background: var(--accent-gold); border-color: var(--accent-gold); color: #1a1614; font-weight: 600; }
  .icon-btn { width: 40px; height: 40px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10; }
  #drawer-bg.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 90vw);
    background: var(--bg-panel); border-left: 1px solid var(--border-subtle);
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 11; padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h2 { font-size: 12px; color: var(--accent-gold); margin: 12px 0 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
  .drawer-section { display: flex; flex-direction: column; gap: 8px; }
  #drawer .btn { width: 100%; text-align: left; padding: 12px 16px; font-size: 15px; position: relative; }
  .drawer-badge {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: var(--accent-gold); color: #1a1614; border-radius: 10px;
    padding: 1px 7px; font-size: 11px; font-weight: 700;
  }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  #modal.open { display: flex; }
  .modal-content { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 24px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-content h3 { margin: 0 0 4px; font-size: 18px; font-family: var(--font-serif); color: var(--accent-gold); }
  .modal-content input { width: 100%; background: var(--bg-deep); border: 1px solid var(--border-subtle); color: var(--text-primary); border-radius: 8px; padding: 12px 14px; font-size: 16px; font-family: var(--font-sans); outline: none; }
  .save-item { padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .save-item:active { background: #3a342f; }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-secondary); }
  .kv .v { color: var(--text-primary); font-weight: 500; font-family: var(--font-serif); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { background: var(--bg-card); padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
  .tag.empty { color: #5a5a4e; font-style: italic; }
  .tag.skill { border-color: #4a3a6e; color: #b48cff; }
  .tag.ability { border-color: #5a3a2a; color: #e8c8a8; }
  .tag.warn { border-color: #5a3a2a; color: #d45a5a; background: #2a1f1a; }
  .tag.good { border-color: #2a4a2a; color: #7fbf7f; background: #1f2a1f; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-box { background: var(--bg-card); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border-subtle); }
  .stat-box .lbl { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .val { font-size: 18px; font-weight: 700; color: var(--accent-gold); margin-top: 4px; font-family: var(--font-serif); }
  .stat-box .mod { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-family: monospace; }
  .dc-box { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .dc-box.up { border-color: #5a3a2a; }
  .dc-box.down { border-color: #2a4a2a; }
  .dc-box .dc-val { font-size: 20px; font-weight: 700; font-family: var(--font-serif); }
  .dc-box.up .dc-val { color: #d45a5a; }
  .dc-box.down .dc-val { color: #7fbf7f; }
  .dc-box .dc-val.neutral { color: var(--text-secondary); }
  .ability-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .ability-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .ability-name { font-weight: 600; color: var(--accent-gold); font-size: 14px; font-family: var(--font-serif); }
  .ability-uses { font-size: 12px; font-family: monospace; color: var(--text-secondary); }
  .ability-uses.empty { color: #d45a5a; }
  .ability-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
  .ability-recharge { font-size: 10px; color: #5a5a4e; margin-top: 3px; font-style: italic; }
  .ability-card.passive { border-color: #4a3a6e; }
  .ability-card.passive .ability-name { color: #b48cff; }
  .situation-box {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  }
  .situation-box .sit-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .situation-box .sit-row .lbl { color: var(--text-secondary); }
  .situation-box .sit-row .val { color: var(--text-primary); font-weight: 500; }
  .situation-box .sit-row .val.warn { color: #d45a5a; }
  .situation-box .sit-row .val.good { color: #7fbf7f; }
  .dice-preset {
    flex: 1 1 auto; min-width: 62px; padding: 8px 10px;
    background: var(--bg-card); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: 8px;
    cursor: pointer; font-family: monospace; font-size: 14px;
    transition: background 0.15s;
  }
  .dice-preset:active { background: #3a342f; }
  .dice-preset.active { border-color: var(--accent-gold); color: var(--accent-gold); }
  /* Заметки */
  .note-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .note-tabs::-webkit-scrollbar { display: none; }
  .note-tab {
    padding: 6px 12px; border-radius: 16px; font-size: 12px;
    background: var(--bg-card); color: var(--text-secondary);
    border: 1px solid var(--border-subtle); cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .note-tab.active { background: var(--accent-gold); color: #1a1614; border-color: var(--accent-gold); font-weight: 600; }
  .note-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; transition: background 0.15s;
  }
  .note-card:active { background: #3a342f; }
  .note-card.unread { border-left: 3px solid var(--accent-gold); }
  .note-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px; gap: 8px;
  }
  .note-title { font-weight: 600; color: var(--text-primary); font-size: 14px; flex: 1; }
  .note-type-badge {
    font-size: 10px; color: var(--text-secondary);
    background: var(--bg-deep); padding: 1px 6px; border-radius: 4px;
  }
  .note-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .note-content { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
  .note-content.expanded { color: var(--text-primary); }
  .note-actions { display: flex; gap: 6px; margin-top: 6px; }
  .note-action-btn {
    background: transparent; border: 1px solid var(--border-subtle);
    color: var(--text-secondary); border-radius: 6px;
    padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .note-action-btn:active { background: var(--bg-deep); }
  /* Перенос партии между устройствами */
  .transfer-area {
    width: 100%; min-height: 150px; max-height: 42vh; resize: vertical;
    background: var(--bg-deep); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 10px; font: 12px/1.5 monospace; outline: none;
  }
  .transfer-area:focus { border-color: var(--accent-gold); }
  .transfer-hint { color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
  .transfer-info { color: var(--text-secondary); font-size: 11px; margin: 6px 0; }
  .transfer-info.warn { color: #e57373; }
  .transfer-row { display: flex; gap: 7px; }
  .transfer-row .btn { flex: 1; min-width: 0; }
</style>
</head>
<body>

<header>
  <h1>🎲 <span>RPG</span> ИИ-Мастер</h1>
  <button class="icon-btn" id="menu-btn" aria-label="Меню">☰</button>
</header>

<div id="status"></div>

<div id="quick-actions">
  <button class="quick-btn" data-quick="Я внимательно осматриваюсь вокруг. Что я вижу?">🔍 Осмотреться</button>
  <button class="quick-btn" data-quick="Я встаю и готовлюсь к действию.">🧍 Встать</button>

// Local campaigns are isolated between authenticated users in the same browser.
function persist() {
  try { localStorage.setItem(LS_KEY + '_' + authUser, JSON.stringify({messages, state, memory, ui_events: uiEvents})); } catch(e){}
}
function restore() {
  try {
    const r = localStorage.getItem(LS_KEY + '_' + authUser) ||
              (authUser === 'owner' ? localStorage.getItem('rpg_session_v9') : null);
    if (!r) return null;
    const d = JSON.parse(r);
    if (d && Array.isArray(d.messages)) return d;
  } catch(e){}
  return null;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* AUTH: Only the opaque, ASCII-safe session token belongs in HTTP headers.
   The server resolves the account from the session; names (including Cyrillic)
   must never be sent via X-RPG-User or another HTTP header. */
function authHeaders() {
  return {'Authorization': 'Bearer ' + authToken};
}
async function checkAuth(token) {
  try {
    const response = await fetch('/api/auth/check', {
      headers: {'Authorization': 'Bearer ' + token},
      cache: 'no-store'
    });
    if (!response.ok) return null;
    const data = await response.json();
    return data.user || null;
  } catch (e) { return null; }
}
async function showLogin() {
  let config = {registration_enabled: true, invite_required: false};
  try {
    const r = await fetch('/api/auth/config', {cache: 'no-store'});
    if (r.ok) config = await r.json();
  } catch (e) { /* Server/network failure will surface on submission. */ }
  const registrationTab = config.registration_enabled
    ? '<button class="btn" id="auth-register-mode" type="button">Зарегистрироваться</button>'
    : '';
  const inviteField = config.invite_required
    ? `<div id="invite-group" style="display:none"><label for="auth-invite">Код приглашения</label>
       <input id="auth-invite" type="password" autocomplete="off" maxlength="128"></div>`
    : '';
  modalContent.innerHTML = `<h3>🎲 RPG-мастер</h3>
    <p style="color:var(--text-secondary)">Войдите в свой аккаунт или создайте новый. У каждого игрока будут свои сохранения.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="auth-login-mode" type="button">Войти</button>
      ${registrationTab}
    </div>
    <label for="auth-username">Логин</label>
    <input id="auth-username" type="text" autocomplete="username" placeholder="Например, ivan" maxlength="32">
    <label for="auth-password">Пароль</label>
    <input id="auth-password" type="password" autocomplete="current-password" maxlength="128">
    <div id="auth-confirm-group" style="display:none">
      <label for="auth-confirm">Повторите пароль</label>
      <input id="auth-confirm" type="password" autocomplete="new-password" maxlength="128">
    </div>
    ${inviteField}
    <p id="auth-hint" style="font-size:12px;color:var(--text-secondary)">Для владельца: логин owner и ключ RPG_ACCESS_TOKEN.</p>
    <div id="auth-error" role="alert" style="color:#e57373;min-height:20px;font-size:13px"></div>
    <button class="btn primary" id="auth-submit" type="button" style="width:100%">Войти</button>`;
  modalEl.classList.add('open');
  return new Promise(resolve => {
    const userBox = document.getElementById('auth-username');
    const passBox = document.getElementById('auth-password');
    const confirmBox = document.getElementById('auth-confirm');
    const confirmGroup = document.getElementById('auth-confirm-group');
    const inviteGroup = document.getElementById('invite-group');
    const hint = document.getElementById('auth-hint');
    const error = document.getElementById('auth-error');
    const button = document.getElementById('auth-submit');
    const loginTab = document.getElementById('auth-login-mode');
    const registerTab = document.getElementById('auth-register-mode');
    let mode = 'login';
    function setMode(next) {
      mode = next;
      const isRegister = mode === 'register';
      confirmGroup.style.display = isRegister ? '' : 'none';
      if (inviteGroup) inviteGroup.style.display = isRegister ? '' : 'none';
      passBox.autocomplete = isRegister ? 'new-password' : 'current-password';
      button.textContent = isRegister ? 'Создать аккаунт' : 'Войти';
      hint.textContent = isRegister
        ? 'Логин: 3–32 символа (буквы, цифры, _ или -). Пароль: минимум 8 символов.'
        : 'Для владельца: логин owner и ключ RPG_ACCESS_TOKEN.';
      loginTab.classList.toggle('primary', !isRegister);
      if (registerTab) registerTab.classList.toggle('primary', isRegister);
      error.textContent = '';
    }
    loginTab.onclick = () => setMode('login');
    if (registerTab) registerTab.onclick = () => setMode('register');
    async function submit() {
      const username = userBox.value.trim(), password = passBox.value;
      if (!username || !password) { error.textContent = 'Введите логин и пароль.'; return; }
      if (mode === 'register' && password !== confirmBox.value) {
        error.textContent = 'Пароли не совпадают.'; return;
      }
      button.disabled = true;
      error.textContent = mode === 'register' ? 'Создаём аккаунт…' : 'Проверяем пароль…';
      try {
        const endpoint = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const payload = {username, password};
        if (inviteGroup) payload.invite_code = document.getElementById('auth-invite').value;
        const response = await fetch(endpoint, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload), cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok || !result.ok || !result.token) {
          error.textContent = result.error || 'Не удалось войти. Повторите попытку.';
          return;
        }
        authUser = result.user;
        authToken = result.token;
        try { sessionStorage.setItem(AUTH_KEY, JSON.stringify({user: authUser, token: authToken})); } catch(e) {}
        modalEl.classList.remove('open');
        resolve(true);
      } catch(e) {
        error.textContent = 'Нет соединения с сервером. Попробуйте ещё раз.';
      } finally { button.disabled = false; }
    }
    button.onclick = submit;
    [userBox, passBox, confirmBox].forEach(el => {
      el.onkeydown = e => { if (e.key === 'Enter') submit(); };
    });
    userBox.focus();
  });
}
async function ensureAuth() {
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); } catch(e) {}
  if (saved && saved.user && typeof saved.token === 'string') {
    const user = await checkAuth(saved.token);
    if (user) { authUser = user; authToken = saved.token; return true; }
    try { sessionStorage.removeItem(AUTH_KEY); } catch(e) {}
  }
  // Only local unsafe development mode may have no credentials.
  const unauthenticatedUser = await checkAuth('');
  if (unauthenticatedUser) { authUser = unauthenticatedUser; authToken = ''; return true; }
  return showLogin();
}
async function logoutAccount() {
  try {
    await fetch('/api/auth/logout', {method: 'POST', headers: authHeaders(), cache: 'no-store'});
  } catch(e) { /* Logging out locally still works without network. */ }
  try { sessionStorage.removeItem(AUTH_KEY); } catch(e) {}
  location.reload();
}
async function apiFetch(url, options={}) {
  const makeRequest = () => fetch(url, {
    ...options, headers: {...(options.headers || {}), ...authHeaders()}, cache: 'no-store'
  });
  let response = await makeRequest();
  if (response.status === 401) {
    try { sessionStorage.removeItem(AUTH_KEY); } catch(e) {}
    const previousUser = authUser;
    await showLogin();
    if (authUser !== previousUser) {
      location.reload();
      throw new Error('Пользователь изменён, страница перезагружается');
    }
    response = await makeRequest();
  }
  return response;
}

function characterIcon(kind, value) {
  const text = String(value || '').trim().toLowerCase().replace(/ё/g, 'е');
  if (!text) return '❔';
  const choice = (CHARACTER_CHOICES[kind] || []).find(([label]) => label.toLowerCase().replace(/ё/g, 'е') === text);
  if (choice) return choice[1];
  const alias = (CHARACTER_ALIASES[kind] || []).find(([pattern]) => pattern.test(text));
  return alias ? alias[1] : ({race:'🧬', class:'🎯', background:'📜'}[kind] || '❔');
}
function identityTag(kind, value, label = '') {
  if (!value) return '';
  const icon = characterIcon(kind, value);
  return `<span class="identity-tag" title="${esc(label || value)}"><span class="symbol" aria-hidden="true">${icon}</span>${esc(value)}</span>`;
}
function characterIdentity(st) {
  return identityTag('race', st.race, 'Раса') + identityTag('class', st.class, 'Класс') + identityTag('background', st.background, 'Предыстория');
}

      </div>`).join('')}
    <div class="creator-heading">Ваши значки</div><div class="creator-preview" id="creator-preview"></div>

      const val = valueFor(key);

    });

  });
  modalContent.querySelectorAll('.creator-custom').forEach(i => i.addEventListener('input', redraw));
  document.getElementById('creator-cancel').onclick = () => modalEl.classList.remove('open');
  function startGame(description, hero = null) {
    modalEl.classList.remove('open');
    messages = []; state = {...EMPTY_STATE, ...(hero || {})}; memory = {}; uiEvents = [];
    ttsStop(); chatEl.innerHTML = ''; renderStatus(); persist();
    sendMessage(description, {characterCreated: !!hero});
  }
  document.getElementById('creator-submit').onclick = () => {
    const name = document.getElementById('creator-name').value.trim();
    const race = valueFor('race'), cls = valueFor('class'), background = valueFor('background');
    if (!name || !race || !cls || !background) {

      return;
    }

    startGame(description, {name, race, class: cls, background});
  };
  if (world) document.getElementById('creator-skip').onclick = () => {
    startGame(world.prompt + ' Если я ещё не описал персонажа — сначала предложи 2–3 варианта расы, класса и предыстории на выбор.');
  };
  redraw();
}

/* TTS */
const tts = {
  enabled: false, voice: null, rate: 1.0, speaking: false,
  lastText: '', available: ('speechSynthesis' in window)
};
function ttsLoad() {
  if (!tts.available) return;
  const pickVoice = () => {
    const voices = speechSynthesis.getVoices();
    if (!voices.length) return;
    const savedName = localStorage.getItem('rpg_tts_voice_name');
    if (savedName) {
      const v = voices.find(x => x.name === savedName);
      if (v) { tts.voice = v; ttsUpdateUI(); return; }
    }
    const ru = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    tts.voice = ru || voices[0];
    ttsUpdateUI();
  };
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  try {
    const saved = JSON.parse(localStorage.getItem(TTS_KEY) || '{}');
    if (typeof saved.enabled === 'boolean') tts.enabled = saved.enabled;
    if (typeof saved.rate === 'number') tts.rate = saved.rate;
  } catch(e){}
  ttsUpdateUI();
}
function ttsSave() {
  try {
    localStorage.setItem(TTS_KEY, JSON.stringify({enabled: tts.enabled, rate: tts.rate}));
    if (tts.voice) localStorage.setItem('rpg_tts_voice_name', tts.voice.name);
  } catch(e){}
}
function ttsClean(text) {
  return text
    .replace(/\[\[.*?\]\]/g, '').replace(/\[.*?\]/g, '')
    .replace(/\*+.*?\*+/g, '')
    .replace(/[🎲🔊🔈⏩⏹🎙🖼📜💾📂✨❓🌍🔍🚶🗣⚔🛌🎒🎯🧍🪑🧎🐎🏊🪜🤝⛓🛡⭐📈✓✗●▶○🎁🏛👤📝✉🔔💬📔]/g, '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/[\u{1F000}-\u{1FAFF}]/gu, '')
    .replace(/\s+/g, ' ').trim();
}
function ttsSpeak(text, btn) {
  if (!tts.available) { addMsg('system', 'Озвучка не поддерживается.'); return; }
  const clean = ttsClean(text);
  if (!clean) return;
  if (tts.speaking) speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(clean);
  if (tts.voice) utt.voice = tts.voice;
  utt.lang = tts.voice ? tts.voice.lang : 'ru-RU';
  utt.rate = tts.rate; utt.pitch = 1.0;
  if (btn) btn.classList.add('playing');
  utt.onstart = () => { tts.speaking = true; };
  utt.onend = () => { tts.speaking = false; if (btn) btn.classList.remove('playing'); };
  utt.onerror = () => { tts.speaking = false; if (btn) btn.classList.remove('playing'); };
  speechSynthesis.speak(utt);
}
function ttsStop() {
  if (tts.available) speechSynthesis.cancel();
  tts.speaking = false;
  document.querySelectorAll('.speak-btn.playing').forEach(b => b.classList.remove('playing'));
}
function ttsUpdateUI() {
  const btn = document.getElementById('tts-toggle-btn');
  if (btn) {
    btn.textContent = `🔊 Автоозвучка: ${tts.enabled ? 'вкл' : 'выкл'}`;
    btn.classList.toggle('tts-active', tts.enabled);
  }
  const sp = document.getElementById('tts-speed-btn');
  if (sp) sp.textContent = `⏩ Скорость: ${tts.rate.toFixed(1)}×`;
  const vb = document.getElementById('tts-voice-btn');
  if (vb) {
    if (tts.voice) {
      const short = tts.voice.name.length > 22 ? tts.voice.name.substring(0, 22) + '…' : tts.voice.name;
      vb.textContent = `🎙 Голос: ${short}`;
    } else vb.textContent = '🎙 Голос: не выбран';
  }
}
function ttsPickVoice() {
  if (!tts.available) return;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) { addMsg('system', 'Голоса ещё загружаются.'); return; }
  const ruVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  const list = (ruVoices.length ? ruVoices : voices).slice(0, 20);
  return new Promise(res => {
    modalContent.innerHTML = `<h3>🎙 Выбор голоса</h3>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto">
        ${list.map((v, i) => `
          <div class="save-item" data-i="${i}" style="${tts.voice && tts.voice.name === v.name ? 'border-color:var(--accent-gold)' : ''}">
            <div style="color:var(--text-primary);font-size:14px">${esc(v.name)}</div>
            <div style="color:var(--text-secondary);font-size:11px">${esc(v.lang)}${v.default ? ' · по умолчанию' : ''}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn" id="modal-cancel">Закрыть</button>`;
    modalEl.classList.add('open');
    const close = v => { modalEl.classList.remove('open'); res(v); };
    modalContent.querySelectorAll('.save-item').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.i);
        tts.voice = list[idx];
        ttsSave(); ttsUpdateUI();
        close(tts.voice);
        addMsg('system', `Голос: ${tts.voice.name}`);
      };
    });
    document.getElementById('modal-cancel').onclick = () => close(null);
  });
}
document.getElementById('tts-toggle-btn').onclick = () => {
  tts.enabled = !tts.enabled;
  ttsSave(); ttsUpdateUI();
  if (!tts.enabled) ttsStop();
  if (tts.enabled && tts.available) {
    try {
      const unlock = new SpeechSynthesisUtterance(' ');
      unlock.volume = 0;
      speechSynthesis.speak(unlock);
    } catch(e){}
  }
};
document.getElementById('tts-last-btn').onclick = () => {
  if (tts.lastText) ttsSpeak(tts.lastText, null);
  else addMsg('system', 'Ещё нет ответа мастера.');
};
document.getElementById('tts-speed-btn').onclick = () => {
  const speeds = [0.8, 1.0, 1.2, 1.5, 1.8];
  const i = speeds.findIndex(s => Math.abs(s - tts.rate) < 0.01);
  tts.rate = speeds[(i + 1) % speeds.length];
  ttsSave(); ttsUpdateUI();
};
document.getElementById('tts-voice-btn').onclick = () => ttsPickVoice();
document.getElementById('tts-stop-btn').onclick = () => ttsStop();

/* Gameplay cards are local UI events, NOT model dialogue. Their position is
   counted in dialogue messages, so dice/stats survive saved-game restore without
   changing XP IDs or incremental campaign memory hashes. */
const STAT_LABELS = [
  ['str', 'СИЛ', 'Сила'], ['dex', 'ЛОВ', 'Ловкость'], ['con', 'ТЕЛ', 'Телосложение'],
  ['int', 'ИНТ', 'Интеллект'], ['wis', 'МДР', 'Мудрость'], ['cha', 'ХАР', 'Харизма']
];
function snapshotCharacter(st) {
  const s = st && typeof st === 'object' ? st : {};
  const stats = {};
  for (const [key] of STAT_LABELS) {
    const n = Number((s.stats || {})[key]);
    stats[key] = Number.isFinite(n) ? n : null;
  }
  return {
    name: s.name || 'Герой', race: s.race || '', class: s.class || '',
    background: s.background || '', level: s.level ?? 1,
    hp: s.hp ?? 10, max_hp: s.max_hp ?? 10, xp: s.xp ?? 0,
    xp_next: s.xp_next ?? 100, gold: s.gold ?? 0, stats
  };
}
function characterSheetHtml(s) {
  const stats = s.stats || {};
  const statBoxes = STAT_LABELS.map(([key, shortName, longName]) => {
    const val = Number(stats[key]);
    const valid = stats[key] !== null && stats[key] !== undefined && Number.isFinite(val);
    const modifier = valid ? Math.floor((val - 10) / 2) : null;
    const modText = modifier === null ? '—' : (modifier >= 0 ? '+' : '') + modifier;
    return `<div class="sheet-stat" title="${longName}"><div class="sheet-stat-name">${shortName}</div><div class="sheet-stat-value">${valid ? esc(val) : '—'}</div><div class="sheet-stat-mod">${modText}</div></div>`;
  }).join('');
  return `<div class="sheet-heading">📜 Лист героя · ${esc(s.name || 'Герой')}</div>
    <div class="identity-tags">${characterIdentity(s)}</div>
    <div class="sheet-meta"><span>⭐ Уровень ${esc(s.level ?? 1)}</span>
    <span>❤️ HP ${esc(s.hp ?? 10)}/${esc(s.max_hp ?? 10)}</span>
    <span>✨ XP ${esc(s.xp ?? 0)}/${esc(s.xp_next ?? 100)}</span>
    <span>🪙 Золото ${esc(s.gold ?? 0)}</span></div>
    <div class="sheet-stats">${statBoxes}</div>
    <div class="sheet-footer">Полный лист и умения — в профиле персонажа.</div>`;
}
function diceResultHtml(roll) {
  const rolls = Array.isArray(roll.rolls) ? roll.rolls.map(n => esc(n)).join(' + ') : '';
  const mod = Number(roll.mod) || 0;
  const modText = mod === 0 ? '' : (mod > 0 ? ' + ' : ' − ') + Math.abs(mod);
  const calc = rolls ? `${rolls}${modText} = ${esc(roll.total)}` : esc(roll.total);
  const label = roll.label ? ` ${esc(String(roll.label).slice(0, 40))}` : ' кубика';
  const dc = Number(roll.dc);
  const difficulty = roll.dc !== undefined && roll.dc !== null && Number.isInteger(dc) && dc > 0 && dc <= 99
    ? ` · Сложность ${dc}` : '';
  return `<div class="dice-label">🎲 Бросок${label}</div>
    <div><b>${esc(roll.expr)}</b> → <span class="dice-total">${esc(roll.total)}</span></div>
    <div class="dice-details">Расчёт: ${calc}${difficulty}</div>`;
}
/* Resolve the check most recently ANNOUNCED by the GM. A quick 1d20 roll
   inherits its explicitly displayed modifier; never guess the modifier for
   unrelated dice or override /roll 1d20+N entered by the player. */
function pendingDeclaredCheck() {
  const last = messages[messages.length - 1];
  if (!last || last.role !== 'assistant') return null;
  const text = String(last.content || '').slice(-600);
  const checks = /(?:бросок|проверка|бросьте|киньте|кидайте|проверьте)[^\r\n]{0,180}/gi;
  const stats = [
    [/ловкост/i, 'dex', 'Ловкости'],
    [/телосложен/i, 'con', 'Телосложения'],
    [/интеллект/i, 'int', 'Интеллекта'],
    [/мудрост/i, 'wis', 'Мудрости'],
    [/харизм/i, 'cha', 'Харизмы'],
    [/сил[аыуе]/i, 'str', 'Силы']
  ];
  let found = null;
  for (const sectionMatch of text.matchAll(checks)) {
    const section = sectionMatch[0];
    const dice = /(?:1d20|d20)(?![\w])\s*([+\-−]\s*\d{1,2})?/i.exec(section);
    if (!dice) continue;
    const attribute = stats.find(([re]) => re.test(section));
    let modifier = 0;
    if (dice[1]) {
      modifier = Number(dice[1].replace(/\s/g, '').replace('−', '-'));
      // Example: 1d20+2 (Ловкость) +1 (Акробатика).
      // Only accept another immediately adjacent, labelled bonus; never
      // accidentally add a DC adjustment mentioned later in the scene.
      const afterDice = section.slice(dice.index + dice[0].length);
      const skill = /^(?:\s*\([^)]{1,40}\))?\s*([+\-−]\s*\d{1,2})(?=\s*(?:\(|$|[—–,]))/.exec(afterDice);
      if (skill) modifier += Number(skill[1].replace(/\s/g, '').replace('−', '-'));
    } else if (attribute) {
      const score = Number(state && state.stats && state.stats[attribute[1]]);
      if (Number.isFinite(score) && score >= 1 && score <= 30) {
        modifier = Math.floor((score - 10) / 2);
      }
    }
    const dcMatch = /(?:сложност[ьи]|\bDC\b|\bКС\b)\s*[:=№]?\s*(\d{1,2})(?!\d)/i.exec(section);
    found = {
      mod: Number.isInteger(modifier) ? modifier : 0,
      label: attribute ? attribute[2] : '',
      dc: dcMatch ? Number(dcMatch[1]) : null
    };
  }
  return found;
}

function showUiEvent(event) {
  if (event.kind === 'character_sheet') return addHtmlMsg('character-sheet', characterSheetHtml(event.sheet || {}));
  if (event.kind === 'dice') return addHtmlMsg('dice', diceResultHtml(event.roll || {}));
}
function recordUiEvent(event) {
  uiEvents.push({...event, at: messages.length});
  showUiEvent(event);
  persist();
}
function isCharacterReady(s) {
  return !!(s && s.name && s.name !== 'Пустой' && (s.race || s.class));
}

/* API CALLS */
async function callAI(msgs, options = {}) {
  busy = true; sendBtn.disabled = true;
  document.querySelectorAll('.quick-btn').forEach(b => b.disabled = true);
  if (tts.speaking) ttsStop();
  const md = document.createElement('div');
  md.className = 'msg master typing-indicator';
  chatEl.appendChild(md); scrollBottom();
  let full = '';
  let streamFailed = false;
  try {
    const res = await apiFetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: msgs, state, memory})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(); const dec = new TextDecoder();
    md.classList.remove('typing-indicator');
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const c = dec.decode(value, { stream: true});
      if (!c) continue;
      full += c; md.textContent = full; scrollBottom();
    }
    const t = dec.decode();
    if (t) { full += t; md.textContent = full; scrollBottom(); }
  } catch(e) {
    streamFailed = true;
    md.classList.remove('typing-indicator');
    md.remove();
    addMsg('system', `Ошибка ответа ИИ: ${e.message}. Ответ не записан в историю.`);
  }
  if (full.trim() && full.includes('[Ошибка API:')) {
    md.remove();
    addMsg('system', full.trim() + '\n\nОтвет не добавлен в историю игры. Можно повторить отправку.');
    full = '';
  }
  if (full.trim() && !streamFailed) {
    messages.push({role: 'assistant', content: full});
    persist();
    md.remove();
    const finalMsg = addMsg('master', full);
    tts.lastText = full;
    if (tts.enabled && tts.available) {
      setTimeout(() => {
        const btn = finalMsg.querySelector('.speak-btn');
        ttsSpeak(full, btn);
      }, 60);
    }
    const wasEmptyCharacter = !isCharacterReady(state);
    const stateOk = await updateState();
    if (stateOk && isCharacterReady(state) &&
        (options.characterCreated || wasEmptyCharacter) &&
        !uiEvents.some(e => e.kind === 'character_sheet')) {
      recordUiEvent({kind: 'character_sheet', sheet: snapshotCharacter(state)});
    }
    await updateMemory();
  }
  busy = false; sendBtn.disabled = false;
  document.querySelectorAll('.quick-btn').forEach(b => b.disabled = false);
  inputEl.focus();
}
async function updateState() {
  if (!state) state = {...EMPTY_STATE};
  try {
    const res = await apiFetch('/api/state', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages, state})
    });
    if (res.ok) {
      const oldLevel = Number(state.level || 1);
      state = await res.json();
      if (Number(state.level || 1) > oldLevel) {
        const gained = Number(state.level) - oldLevel;
        addMsg('system', `🎉 Доступно повышение уровня: ${state.level} (получено уровней: ${gained}). Обсуди с мастером выбор повышения характеристик и умения.`);
      }
      renderStatus(); persist();
      return true;
    }
    return false;
  } catch(e) {
    addMsg('system', 'Не удалось обновить лист персонажа: ' + e.message);
    return false;
  }
}

async function updateMemory() {
  const summarizedCount = Number(memory && memory.covered_count || 0);
  if (messages.length - summarizedCount < 26) return;
  try {
    const res = await apiFetch('/api/memory', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages, memory})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    memory = await res.json();
    persist();
  } catch(e) { console.warn('Память пока не обновлена:', e); }
}

/* SEND */
async function sendMessage(text, options = {}) {
  if (busy || rolling) return;
  text = (text || '').trim();
  if (!text) return;
  if (text.startsWith('/')) {
    const [c, ...r] = text.split(/\s+/);
    inputEl.value = ''; autosize();
    handleCommand(c.toLowerCase(), r.join(' '));
    return;
  }
  const createButton = chatEl.querySelector('[data-create-character]');
  if (createButton) createButton.remove();
  addMsg('user', text);
  messages.push({role: 'user', content: text});
  persist();
  inputEl.value = ''; autosize();
  await callAI(messages, options);
}
function handleCommand(cmd, arg) {
  switch(cmd) {
    case '/roll': return doRoll(arg || '1d20');
    case '/sheet': return doSheet();
    case '/skills': return doSkills();
    case '/notes': return doNotes();
    case '/save': return doSave(arg);
    case '/load': return doLoad(arg);
    case '/transfer': return doTransfer();
    case '/reset': return doReset();
    case '/help': return doHelp();
    default: addMsg('system', `Неизвестная команда: ${cmd}. Введите /help.`);
  }
}
async function doRoll(expr) {
  if (busy || rolling) return;
  // A plain d20 means "roll the check you just asked for" when the GM
  // announced one. Explicit /roll 1d20+N always takes priority.
  const check = /^\s*(?:1d20|d20)\s*$/i.test(String(expr)) ? pendingDeclaredCheck() : null;
  const effectiveExpr = check && check.mod
    ? `1d20${check.mod > 0 ? '+' : ''}${check.mod}` : expr;
  rolling = true;
  const animDiv = addHtmlMsg('dice',
    `<span class="dice-emoji">🎲</span> Бросок ${esc(effectiveExpr)}...`);
  try {
    await new Promise(r => setTimeout(r, 450));
    const res = await apiFetch('/api/roll', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({expr: effectiveExpr})
    });
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || 'Не удалось выполнить бросок');
    const mod = d.mod ? (d.mod > 0 ? '+' + d.mod : '' + d.mod) : '';
    animDiv.remove();
    // Show the roll card BEFORE the master's streamed response, and keep it in saves.
    recordUiEvent({kind: 'dice', roll: {
      expr: d.expr, rolls: d.rolls, mod: d.mod, total: d.total,
      label: check ? check.label : '', dc: check ? check.dc : null
    }});
    messages.push({role: 'user', content:
      `[[БРОСОК]] ${d.expr} → [${d.rolls.join(', ')}]${mod} = ${d.total}. ` +
      `Это ОКОНЧАТЕЛЬНЫЙ результат, бонус характеристики уже учтён: НЕ прибавляй модификаторы второй раз. ` +
      `Сравни ${d.total} с DC, который ты объявил ранее. Опиши исход без повторного броска.`});
    persist();
    await callAI(messages);
  } catch(e) { animDiv.remove(); addMsg('system', 'Ошибка броска: ' + e.message); }
  finally { rolling = false; }
}

/* SHEET */
async function doSheet() {
  if (!state) return;
  const s = state.stats || {};
  const quests = (state.quests || []).map(q => {
    if (typeof q === 'string') {
      return { id: 'old-' + q, name: q, type: 'side', status: 'active',
               chain: '', chain_order: 0, stages: [], current_stage: 0,
               rewards: {}, giver: '', location: '' };
    }
    return q;
  });

  const inv = (state.inventory || []).length
    ? state.inventory.map(i => `<span class="tag">${esc(i)}</span>`).join('')
    : '<span class="tag empty">пусто</span>';
  const cd = (state.conditions || []).length
    ? state.conditions.map(c => `<span class="tag">${esc(c)}</span>`).join('')
    : '<span class="tag empty">нет</span>';

  const typeInfo = {
    main: { icon: '⭐', label: 'Главный', color: '#c9a227' },
    side: { icon: '📜', label: 'Побочный', color: '#5a8ed4' },
    personal: { icon: '👤', label: 'Личный', color: '#b48cff' },
    faction: { icon: '🏛', label: 'Фракция', color: '#7fbf7f' }
  };

  function renderQuest(q) {
    const t = typeInfo[q.type] || typeInfo.side;
    const isCompleted = q.status === 'completed';
    const isFailed = q.status === 'failed';
    const statusIcon = isCompleted ? '✓' : (isFailed ? '✗' : '●');
    const statusColor = isCompleted ? '#5a5a4e' : (isFailed ? '#d45a5a' : t.color);
    const stages = (q.stages || []).map((st, i) => {
      const mark = st.done ? '✓' : (i === (q.current_stage || 0) ? '▶' : '○');
      const color = st.done ? '#5a5a4e' : (i === (q.current_stage || 0) ? 'var(--text-primary)' : 'var(--text-secondary)');
      const strike = st.done ? 'text-decoration:line-through;' : '';
      return `<div style="font-size:12px;color:${color};${strike}margin:2px 0">${mark} ${esc(st.text || '')}</div>`;
    }).join('');
    const rewards = q.rewards && Object.keys(q.rewards).length
      ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">
           🎁 ${q.rewards.xp ? `+${q.rewards.xp} XP` : ''}
           ${q.rewards.gold ? ` · +${q.rewards.gold}💰` : ''}
           ${q.rewards.items && q.rewards.items.length ? ' · ' + q.rewards.items.map(esc).join(', ') : ''}
         </div>`
      : '';
    return `<div class="ability-card" style="border-color:${statusColor};${isCompleted ? 'opacity:0.55;' : ''}">
      <div class="ability-header">
        <span class="ability-name" style="color:${statusColor}">${statusIcon} ${t.icon} ${esc(q.name || '—')}</span>
      </div>
      <div style="font-size:11px;color:${statusColor};margin-bottom:4px">${t.label}${q.giver ? ' · от ' + esc(q.giver) : ''}${q.location ? ' · ' + esc(q.location) : ''}</div>
      <div>${stages || '<div style="font-size:12px;color:var(--text-secondary);font-style:italic">— нет этапов —</div>'}</div>
      ${rewards}
    </div>`;
  }

  const activeQuests = quests.filter(q => q.status === 'active');
  const completedQuests = quests.filter(q => q.status === 'completed' || q.status === 'failed');
  const questsBlock = activeQuests.length
    ? activeQuests.map(renderQuest).join('')
    : '<div class="tag empty">нет активных квестов</div>';
  const completedBlock = completedQuests.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--text-secondary);font-size:12px">Выполненные (${completedQuests.length})</summary><div style="margin-top:6px">${completedQuests.map(renderQuest).join('')}</div></details>`
    : '';

  const lvlHist = (state.level_history || []).length
    ? state.level_history.map(h =>
        `<div style="font-size:12px;color:var(--text-secondary);padding:3px 0;border-bottom:1px solid var(--border-subtle)">
          <b style="color:var(--text-primary)">Ур. ${h.level}</b>
          · ${esc(h.hp || '')} HP
          ${h.stats ? ' · ' + esc(h.stats) : ''}
          ${h.abilities ? ' · ' + esc(h.abilities) : ''}
        </div>`
      ).join('')
    : '<div class="tag empty">первый уровень — история пуста</div>';

  const dc = state.dc_modifier || 0;
  const dcBoxCls = dc > 0 ? 'up' : (dc < 0 ? 'down' : '');
  const dcSign = dc > 0 ? '+' : '';
  const dcReasons = (state.dc_modifier_reasons || []).length
    ? state.dc_modifier_reasons.map(r => `<span class="tag warn">${esc(r)}</span>`).join('')
    : '<span class="tag empty">нет модификаторов</span>';
  const dcBox = `
    <div class="dc-box ${dcBoxCls}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="color:var(--text-secondary);font-size:12px">🎯 Модификатор сложности</span>
        <span class="dc-val ${dc === 0 ? 'neutral' : ''}">${dc === 0 ? '0' : dcSign + dc}</span>
      </div>
      <div class="tags">${dcReasons}</div>
    </div>`;

  const posInfo = getPositionInfo(state.position);
  const covInfo = getCoverInfo(state.cover);
  const situationBox = `
    <div class="situation-box">
      <div style="color:var(--text-secondary);font-size:12px;margin-bottom:6px">📍 Положение и обстановка</div>
      <div class="sit-row"><span class="lbl">Позиция</span><span class="val ${posInfo.mod !== 0 ? 'warn' : ''}">${posInfo.icon} ${esc(posInfo.label)}</span></div>
      <div class="sit-row"><span class="lbl">Укрытие</span><span class="val">${covInfo.icon || '—'} ${esc(covInfo.label)}</span></div>
      <div class="sit-row"><span class="lbl">В руках</span><span class="val">${esc(state.weapon_in_hand || '—')}</span></div>
      ${state.restrained ? `<div class="sit-row"><span class="lbl">Связан</span><span class="val warn">⛓ Да</span></div>` : ''}
    </div>`;

  const statMod = (val) => {
    const m = Math.floor((val - 10) / 2);
    return m >= 0 ? '+' + m : '' + m;
  };
  const notesCount = (state.notes || []).length;
  const notesUnread = (state.notes || []).filter(n => n.unread).length;

  modalContent.innerHTML = `
    <div class="identity-hero">
      <div class="identity-hero-crest" aria-hidden="true">${characterIcon('class', state.class)}</div>
      <div><h3>📜 ${esc(state.name || 'Пустой')}</h3>
      <div class="identity-tags">${characterIdentity(state)}</div></div>
    </div>
    <div class="kv"><span class="k">Раса</span><span class="v">${characterIcon('race', state.race)} ${esc(state.race || '—')}</span></div>
    <div class="kv"><span class="k">Класс</span><span class="v">${characterIcon('class', state.class)} ${esc(state.class || '—')}</span></div>
    <div class="kv"><span class="k">Предыстория</span><span class="v">${characterIcon('background', state.background)} ${esc(state.background || '—')}</span></div>
    <div class="kv"><span class="k">Уровень</span><span class="v">${state.level}${state.level_pending ? ` · повышение доступно (${state.level_pending})` : ''}</span></div>
    <div class="kv"><span class="k">Опыт</span><span class="v">${state.xp} / ${state.xp_next}</span></div>
    <div class="kv"><span class="k">Здоровье</span><span class="v">${state.hp} / ${state.max_hp}</span></div>
    <div class="kv"><span class="k">Золото</span><span class="v">${state.gold}</span></div>
    <h3 style="margin-top:12px;font-size:15px">Характеристики</h3>
    <div class="stats-grid">${['str','dex','con','int','wis','cha'].map(k =>
      `<div class="stat-box"><div class="lbl">${k.toUpperCase()}</div><div class="val">${s[k] || 10}</div><div class="mod">${statMod(s[k] || 10)}</div></div>`
    ).join('')}</div>
    ${situationBox}
    ${dcBox}
    <h3 style="margin-top:12px;font-size:15px">🎯 Квесты</h3>
    <div>${questsBlock}${completedBlock}</div>
    <h3 style="margin-top:12px;font-size:15px">📈 Прокачка</h3>
    <div>${lvlHist}</div>
    <h3 style="margin-top:12px;font-size:15px">🎒 Инвентарь</h3><div class="tags">${inv}</div>
    <h3 style="margin-top:12px;font-size:15px">Состояния</h3><div class="tags">${cd}</div>
    <button class="btn" style="margin-top:8px" onclick="document.getElementById('modal').classList.remove('open');doNotes();">📝 Заметки (${notesCount}${notesUnread > 0 ? ', ' + notesUnread + ' новых' : ''})</button>
    <button class="btn" style="margin-top:4px" onclick="document.getElementById('modal').classList.remove('open');doSkills();">🎯 Умения и навыки</button>
    <button class="btn primary" style="margin-top:4px" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>`;
  modalEl.classList.add('open');
}

/* NOTES — отдельная вкладка */
async function doNotes() {
  if (!state) return;
  const notes = (state.notes || []).slice();

  const typeOrder = ['notification', 'letter', 'document', 'journal', 'note', 'rumor'];
  const types = [...new Set(notes.map(n => n.type || 'note'))].sort((a, b) => {
    const ia = typeOrder.indexOf(a); const ib = typeOrder.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  let activeFilter = 'all';

  function renderList() {
    const filtered = activeFilter === 'all' ? notes : notes.filter(n => (n.type || 'note') === activeFilter);
    const sorted = filtered.slice().sort((a, b) => {
      if (a.unread !== b.unread) return a.unread ? -1 : 1;
      return 0;
    });

    const counts = { all: notes.length };
    types.forEach(t => { counts[t] = notes.filter(n => (n.type || 'note') === t).length; });

    const tabsHtml = `
      <div class="note-tabs">
        <div class="note-tab ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">Все (${counts.all})</div>
        ${types.map(t => {
          const info = NOTE_TYPES[t] || NOTE_TYPES.note;
          return `<div class="note-tab ${activeFilter === t ? 'active' : ''}" data-filter="${t}">${info.icon} ${info.label} (${counts[t]})</div>`;
        }).join('')}
      </div>`;

    const listHtml = sorted.length ? sorted.map(n => {
      const info = NOTE_TYPES[n.type] || NOTE_TYPES.note;
      const unreadClass = n.unread ? 'unread' : '';
      const contentClass = n._expanded ? 'expanded' : '';
      const metaParts = [];
      if (n.source) metaParts.push(`от: ${esc(n.source)}`);
      if (n.date) metaParts.push(esc(n.date));
      return `
        <div class="note-card ${unreadClass}" data-id="${esc(n.id)}">
          <div class="note-header">
            <span class="note-title">${info.icon} ${esc(n.title || '(без названия)')}</span>
            <span class="note-type-badge">${info.label}</span>
          </div>
          ${metaParts.length ? `<div class="note-meta">${metaParts.join(' · ')}</div>` : ''}
          <div class="note-content ${contentClass}" data-content-id="${esc(n.id)}">${esc(n.content || '')}</div>
          <div class="note-actions">
            ${n.unread ? `<button class="note-action-btn" data-action="read" data-id="${esc(n.id)}">✓ Прочитано</button>` : ''}
            <button class="note-action-btn" data-action="delete" data-id="${esc(n.id)}">🗑 Удалить</button>
          </div>
        </div>`;
    }).join('') : '<div class="tag empty">нет заметок</div>';

    modalContent.innerHTML = `
      <h3>📝 Заметки</h3>
      ${tabsHtml}
      <div style="max-height:50vh;overflow-y:auto;margin-top:8px">${listHtml}</div>
      <button class="btn primary" style="margin-top:6px" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>`;

    // Обработчики
    modalContent.querySelectorAll('.note-tab').forEach(tab => {
      tab.onclick = () => { activeFilter = tab.dataset.filter; renderList(); };
    });
    modalContent.querySelectorAll('.note-card').forEach(card => {
      card.onclick = (e) => {
        // Клик по кнопке — обрабатываем отдельно
        if (e.target.closest('.note-action-btn')) return;
        const id = card.dataset.id;
        const note = notes.find(n => n.id === id);
        if (note) {
          note._expanded = !note._expanded;
          // Раскрытие = прочитано
          if (note.unread) {
            note.unread = false;
            saveNotesToState();
          }
          renderList();
        }
      };
    });
    modalContent.querySelectorAll('.note-action-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const idx = notes.findIndex(n => n.id === id);
        if (idx === -1) return;
        if (action === 'read') {
          notes[idx].unread = false;
        } else if (action === 'delete') {
          notes.splice(idx, 1);
        }
        saveNotesToState();
        renderList();
        updateNotesBadge();
      };
    });
  }

  function saveNotesToState() {
    // Убираем служебное поле _expanded перед сохранением
    state.notes = notes.map(n => {
      const copy = { ...n };
      delete copy._expanded;
      return copy;
    });
    persist();
    renderStatus();
  }

  renderList();
  modalEl.classList.add('open');
}

/* SKILLS */
async function doSkills() {
  if (!state) return;
  const prof = (state.proficiencies || []).length
    ? state.proficiencies.map(p => `<span class="tag">${esc(p)}</span>`).join('')
    : '<span class="tag empty">нет владений</span>';
  const skills = (state.skills || []).length
    ? state.skills.map(sk => {
        const bonus = sk.bonus >= 0 ? '+' + sk.bonus : '' + sk.bonus;
        return `<span class="tag skill" title="${esc(sk.source || '')}">${esc(sk.name)} ${bonus}</span>`;
      }).join('')
    : '<span class="tag empty">нет навыков</span>';
  const abilities = (state.abilities || []).length
    ? state.abilities.map(a => {
        const isPassive = a.recharge === 'passive' || !a.uses_max;
        const usesText = isPassive ? '∞' : `${a.uses_left ?? a.uses_max}/${a.uses_max}`;
        const isEmpty = !isPassive && (a.uses_left || 0) === 0;
        const rechargeLabel = {
          'passive': 'пассивное',
          'short_rest': 'короткий отдых',
          'long_rest': 'долгий отдых',
          'day': 'раз в день'
        }[a.recharge] || '';
        return `<div class="ability-card ${isPassive ? 'passive' : ''}">
          <div class="ability-header">
            <span class="ability-name">${esc(a.name)}</span>
            <span class="ability-uses ${isEmpty ? 'empty' : ''}">${usesText}</span>
          </div>
          <div class="ability-desc">${esc(a.description || '')}</div>
          ${rechargeLabel ? `<div class="ability-recharge">⟳ ${esc(rechargeLabel)}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="tag empty">нет умений</div>';
  modalContent.innerHTML = `
    <h3>🎯 ${esc(state.name || 'Пустой')} — Умения</h3>
    ${state.race || state.class || state.background ? `
      <div style="font-size:13px;color:var(--text-secondary)">
        ${[state.race, state.class, state.background].filter(Boolean).map(esc).join(' · ')}
      </div>
    ` : ''}
    <h3 style="margin-top:14px;font-size:15px">Активные умения</h3>
    <div>${abilities}</div>
    <h3 style="margin-top:14px;font-size:15px">Пассивные навыки</h3>
    <div class="tags">${skills}</div>
    <h3 style="margin-top:14px;font-size:15px">Владения</h3>
    <div class="tags">${prof}</div>
    <button class="btn" style="margin-top:10px" onclick="document.getElementById('modal').classList.remove('open');doSheet();">📜 Полный лист</button>
    <button class="btn primary" style="margin-top:4px" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>`;
  modalEl.classList.add('open');
}

/* SAVE / LOAD / RESET / HELP */
async function doSave(name) {
  if (!name) {
    name = await promptModal('Название сохранения', 'game-' + Date.now());
    if (!name) return;
  }
  try {
    const res = await apiFetch('/api/save', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, messages, state, memory, ui_events: uiEvents})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || 'не удалось сохранить');
    addMsg('system', `💾 Сохранено: «${d.name}»`);
  } catch(e) { addMsg('system', 'Ошибка сохранения: ' + e.message); }
}
async function doLoad(name) {
  let saves;
  try { saves = await (await apiFetch('/api/saves')).json(); }
  catch(e) { addMsg('system', 'Ошибка: ' + e.message); return; }
  if (!saves.length) { addMsg('system', 'Нет сохранений.'); return; }
  if (!name) {
    name = await listModal('Выберите сохранение', saves);
    if (!name) return;
  }
  try {
    const res = await apiFetch('/api/load/' + encodeURIComponent(name));
    if (!res.ok) throw new Error('не найдено');
    const d = await res.json();
    messages = d.messages || [];
    state = d.state || {...EMPTY_STATE};
    memory = d.memory || {};
    uiEvents = Array.isArray(d.ui_events) ? d.ui_events : [];
    persist(); renderAll(); renderStatus();
    await updateMemory();
    addMsg('system', d.recovered_from_backup
      ? `⚠️ Основное сохранение повреждено. Загружена резервная копия: «${name}». Сразу сохраните игру под новым именем.`
      : `📂 Загружено: «${name}»`);
  } catch(e) { addMsg('system', 'Ошибка: ' + e.message); }
}
async function manageSaves() {
  let saves;
  try {
    const res = await apiFetch('/api/saves');
    if (!res.ok) throw new Error('Не удалось получить список сохранений');
    saves = await res.json();
  } catch (e) { addMsg('system', 'Ошибка списка сохранений: ' + e.message); return; }
  if (!saves.length) { addMsg('system', 'Нет сохранений для управления.'); return; }
  modalContent.innerHTML = `<h3>Управление сохранениями</h3>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${saves.map(name => `<div style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:8px">
        <div style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(name)}</div>
        <button class="btn" data-rename="${esc(name)}" style="padding:7px 10px">✏️</button>
        <button class="btn" data-delete="${esc(name)}" style="padding:7px 10px;color:#e57373">🗑️</button>
      </div>`).join('')}
    </div>
    <button class="btn" id="manage-close">Закрыть</button>`;
  modalEl.classList.add('open');
  document.getElementById('manage-close').onclick = () => modalEl.classList.remove('open');
  modalContent.querySelectorAll('[data-rename]').forEach(btn => btn.onclick = async () => {
    const oldName = btn.dataset.rename;
    const newName = await promptModal('Переименовать сохранение', oldName);
    if (!newName) { manageSaves(); return; }
    if (newName === oldName) { manageSaves(); return; }
    try {
      const res = await apiFetch('/api/save/rename', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_name:oldName,new_name:newName})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Не удалось переименовать');
      addMsg('system', `✏️ Сохранение переименовано: «${oldName}» → «${data.name}»`);
      manageSaves();
    } catch(e) { addMsg('system', 'Ошибка переименования: ' + e.message); }
  });
  modalContent.querySelectorAll('[data-delete]').forEach(btn => btn.onclick = async () => {
    const name = btn.dataset.delete;
    if (!confirm(`Удалить сохранение «${name}» и его резервную копию? Это действие нельзя отменить.`)) return;
    try {
      const res = await apiFetch('/api/save/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Не удалось удалить');
      addMsg('system', `🗑️ Удалено сохранение: «${name}»`);
      manageSaves();
    } catch(e) { addMsg('system', 'Ошибка удаления: ' + e.message); }
  });
}

function doTransfer() {
  if (busy || rolling) { addMsg('system', 'Дождитесь завершения текущего действия, затем переносите партию.'); return; }
  const current = JSON.stringify({
    schema_version: 4, messages, state, memory, ui_events: uiEvents
  }, null, 2);
  const charName = (state && state.name) || 'Пустой';
  modalContent.innerHTML = `
    <h3>🔄 Перенос партии</h3>
    <div class="transfer-hint">
      <b>Сохранить копию:</b> скопируйте текст или скачайте JSON-файл.
      <br><b>Перенести на другое устройство:</b> войдите в тот же аккаунт и загрузите этот файл или вставьте текст.
      <br><b>Импорт:</b> текущая партия будет заменена; сначала сохраните её, если хотите оставить копию.
    </div>
    <textarea id="transfer-area" class="transfer-area" spellcheck="false" aria-label="Данные партии"></textarea>
    <div id="transfer-info" class="transfer-info"></div>
    <div class="transfer-row">
      <button class="btn" id="transfer-copy" type="button">📋 Скопировать</button>
      <button class="btn" id="transfer-download" type="button">💾 Скачать JSON</button>
    </div>
    <div class="transfer-row">
      <button class="btn" id="transfer-file-btn" type="button">📁 Выбрать файл</button>
      <button class="btn primary" id="transfer-apply" type="button">✅ Импортировать</button>
    </div>
    <input type="file" id="transfer-file" accept=".json,application/json" hidden>
    <button class="btn" id="transfer-close" type="button">Закрыть</button>`;

  const area = document.getElementById('transfer-area');
  const info = document.getElementById('transfer-info');
  const fileInput = document.getElementById('transfer-file');
  area.value = current;

  const showInfo = (message, warn = false) => {
    if (message) {
      info.textContent = message;
      info.className = 'transfer-info' + (warn ? ' warn' : '');
      return;
    }
    const kb = Math.max(1, Math.round(area.value.length / 1024));
    info.textContent = `Размер: ${kb} КБ · сообщений: ${messages.length} · персонаж: «${charName}»`;
    info.className = 'transfer-info';
  };
  showInfo();
  area.addEventListener('input', () => showInfo());

  document.getElementById('transfer-close').onclick = () =>
    modalEl.classList.remove('open');

  document.getElementById('transfer-copy').onclick = async () => {
    const btn = document.getElementById('transfer-copy');
    area.focus();
    area.select();
    let copied = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(area.value);
        copied = true;
      }
    } catch (e) {}
    if (!copied) {
      try { copied = document.execCommand('copy'); } catch (e) {}
    }
    btn.textContent = copied ? '✓ Скопировано' : 'Выделите и скопируйте вручную';
  };

  document.getElementById('transfer-download').onclick = () => {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const safeName = String(charName).replace(/[^\wа-яёА-ЯЁ-]+/g, '_').slice(0, 40) || 'game';
    const blob = new Blob([area.value], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `rpg-${safeName}-${stamp}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  document.getElementById('transfer-file-btn').onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      showInfo('Файл больше 4 МБ. Выберите файл меньшего размера.', true);
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { area.value = String(reader.result || ''); showInfo(); };
    reader.onerror = () => showInfo('Не удалось прочитать файл.', true);
    reader.readAsText(file);
  };

  document.getElementById('transfer-apply').onclick = () => {
    if (busy || rolling) { showInfo('Сначала дождитесь завершения текущего действия.', true); return; }
    const raw = area.value.trim();
    if (!raw) { showInfo('Поле пустое.', true); return; }
    if (raw.length > 4 * 1024 * 1024) {
      showInfo('Данные превышают 4 МБ.', true);
      return;
    }
    if (raw === current) { showInfo('Это текущая партия — менять нечего.'); return; }

    let imported;
    try { imported = JSON.parse(raw); }
    catch (e) { showInfo('JSON повреждён или скопирован не полностью.', true); return; }

    if (!imported || !Array.isArray(imported.messages) || imported.messages.length > 20000) {
      showInfo('Файл не похож на партию: нужен список сообщений (не более 20000).', true);
      return;
    }
    const validMessages = imported.messages.every(m =>
      m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'
    );
    if (!validMessages) {
      showInfo('В истории есть сообщения неверного формата.', true);
      return;
    }

    const rawState = imported.state && typeof imported.state === 'object' && !Array.isArray(imported.state)
      ? imported.state : {};
    const importedState = {...EMPTY_STATE, ...rawState};
    for (const key of ['name','race','class','background','position','cover','weapon_in_hand']) {
      if (typeof importedState[key] !== 'string') importedState[key] = EMPTY_STATE[key];
    }
    for (const key of ['level','xp','xp_next','hp','max_hp','gold','dc_modifier','level_pending']) {
      const value = Number(importedState[key]);
      importedState[key] = Number.isFinite(value) ? Math.trunc(value) : EMPTY_STATE[key];
    }
    importedState.level = Math.max(1, importedState.level);
    importedState.max_hp = Math.max(1, importedState.max_hp);
    importedState.hp = Math.max(0, Math.min(importedState.max_hp, importedState.hp));
    importedState.xp = Math.max(0, importedState.xp);
    importedState.xp_next = Math.max(1, importedState.xp_next);
    importedState.gold = Math.max(0, importedState.gold);
    importedState.stats = importedState.stats && typeof importedState.stats === 'object' &&
      !Array.isArray(importedState.stats) ? importedState.stats : {...EMPTY_STATE.stats};
    for (const key of ['str','dex','con','int','wis','cha']) {
      const value = Number(importedState.stats[key]);
      importedState.stats[key] = Number.isFinite(value) ? Math.max(1, Math.min(30, Math.trunc(value))) : 10;
    }
    for (const key of ['proficiencies','skills','abilities','inventory','notes','quests','conditions',
                       'relationships','faction_clocks','dc_modifier_reasons','level_history','xp_event_ids']) {
      if (!Array.isArray(importedState[key])) importedState[key] = [];
    }
    if (typeof importedState.restrained !== 'boolean') importedState.restrained = false;

    const importedMemory = imported.memory && typeof imported.memory === 'object' && !Array.isArray(imported.memory)
      ? imported.memory : {};
    const importedEvents = Array.isArray(imported.ui_events)
      ? imported.ui_events.filter(e => e && Number.isInteger(e.at) && e.at >= 0 &&
          e.at <= imported.messages.length && ['dice', 'character_sheet'].includes(e.kind) &&
          (e.kind !== 'dice' || (e.roll && typeof e.roll === 'object')) &&
          (e.kind !== 'character_sheet' || (e.sheet && typeof e.sheet === 'object')))
        .slice(0, 2000).map(e => {
          if (e.kind === 'character_sheet') {
            const raw = e.sheet;
            const safe = {...raw};
            for (const key of ['name','race','class','background']) {
              if (typeof safe[key] !== 'string') safe[key] = '';
            }
            safe.stats = safe.stats && typeof safe.stats === 'object' && !Array.isArray(safe.stats)
              ? safe.stats : {};
            return {...e, sheet: snapshotCharacter(safe)};
          }
          const roll = e.roll;
          const num = value => Number.isFinite(Number(value)) ? Number(value) : 0;
          return {...e, roll: {
            expr: typeof roll.expr === 'string' ? roll.expr.slice(0, 80) : '1d20',
            rolls: Array.isArray(roll.rolls) ? roll.rolls.slice(0, 100).map(num) : [],
            mod: num(roll.mod), total: num(roll.total),
            label: typeof roll.label === 'string' ? roll.label.slice(0, 40) : '',
            dc: roll.dc == null ? null : num(roll.dc)
          }};
        })
      : [];
    const name = importedState.name || 'Пустой';
    const level = importedState.level;
    if (!confirm(`Заменить текущую партию?\n\nИмпортируемая: «${name}», уровень ${level}, сообщений ${imported.messages.length}.\nТекущая история будет заменена.`)) return;

    messages = imported.messages;
    state = importedState;
    memory = importedMemory;
    uiEvents = importedEvents;
    persist();
    renderAll();
    renderStatus();
    modalEl.classList.remove('open');
    addMsg('system', `🔄 Партия импортирована: «${name}», уровень ${level}, сообщений ${messages.length}.`);
  };

  modalEl.classList.add('open');
}

function renderAll() {
  chatEl.innerHTML = '';
  // Event positions point to the *next* dialogue message; events at the end
  // are rendered after the most recent reply. Ignore invalid legacy entries.
  const events = new Map();
  (Array.isArray(uiEvents) ? uiEvents : []).forEach(event => {
    if (!event || !Number.isInteger(event.at) || event.at < 0 || event.at > messages.length) return;
    if (!['dice', 'character_sheet'].includes(event.kind)) return;
    if (!events.has(event.at)) events.set(event.at, []);
    events.get(event.at).push(event);
  });
  for (let i = 0; i <= messages.length; i++) {
    for (const event of (events.get(i) || [])) showUiEvent(event);
    if (i === messages.length) break;
    const m = messages[i];
    if (m.role === 'user') {
      if (m.content.startsWith('[[БРОСОК]]')) {
        // New dice cards already appear above; old saves still show the result.
        if (!(events.get(i) || []).some(e => e.kind === 'dice')) {
          const rollText = m.content.replace(/^\[\[БРОСОК\]\]\s*/, '').split('. Сравни с DC')[0];
          addMsg('dice', '🎲 ' + rollText);
        }
      } else {
        addMsg('user', m.content.replace(/^\[\[СИСТЕМА\]\]\s*/, ''));
      }
    } else if (m.role === 'assistant') {
      addMsg('master', m.content);
    }
  }
  const lastMaster = [...messages].reverse().find(m => m.role === 'assistant');
  if (lastMaster) tts.lastText = lastMaster.content;
}

async function init() {
  await ensureAuth();
  const saved = restore();
  if (saved && saved.messages.length) {
    messages = saved.messages;
    state = saved.state || {...EMPTY_STATE};
    memory = saved.memory || {};
    uiEvents = Array.isArray(saved.ui_events) ? saved.ui_events : [];
    // Совместимость
    if (!Array.isArray(state.relationships)) state.relationships = [];
    if (!Array.isArray(state.faction_clocks)) state.faction_clocks = [];
    if (!Array.isArray(state.dc_modifier_reasons)) state.dc_modifier_reasons = [];
    if (!Array.isArray(state.proficiencies)) state.proficiencies = [];
    if (!Array.isArray(state.skills)) state.skills = [];
    if (!Array.isArray(state.abilities)) state.abilities = [];
    if (!Array.isArray(state.level_history)) state.level_history = [];
    if (!Array.isArray(state.xp_event_ids)) state.xp_event_ids = [];
    if (typeof state.level_pending !== 'number') state.level_pending = 0;
    if (!Array.isArray(state.notes)) state.notes = [];
    if (typeof state.dc_modifier !== 'number') state.dc_modifier = 0;
    if (typeof state.race !== 'string') state.race = '';
    if (typeof state.class !== 'string') state.class = '';
    if (typeof state.background !== 'string') state.background = '';
    if (typeof state.position !== 'string') state.position = 'стоит';
    if (typeof state.cover !== 'string') state.cover = 'нет';
    if (typeof state.weapon_in_hand !== 'string') state.weapon_in_hand = '';
    if (typeof state.restrained !== 'boolean') state.restrained = false;
    if (Array.isArray(state.quests)) {
      state.quests = state.quests.map(q => {
        if (typeof q === 'string') {
          return { id: 'legacy-' + Math.random().toString(36).slice(2,8), name: q,
                   type: 'side', status: 'active', chain: '', chain_order: 0,
                   stages: [], current_stage: 0, rewards: {}, giver: '', location: '' };
        }
        return q;
      });
    } else {
      state.quests = [];
    }
    renderAll(); renderStatus();
    addMsg('system', '↩ История восстановлена. Продолжайте.');
    await updateMemory();
  } else {
    state = {...EMPTY_STATE};
    renderStatus();
    showIntro();
  }
  renderWorlds();
  ttsLoad();
  autosize();
}
init();
</script>
</body>
</html>
